<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iPod">
<meta name="theme-color" content="#0e0e0f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>iPod</title>
<style>
  :root { --ambar: #ffb340; --ambar-osc: #3a2a10; --cuerpo: #0e0e0f; --pieza: #1b1b1d; --borde: #2a2a2d; }
  html, body { margin: 0; height: 100%; background: var(--cuerpo); color: #e8e8ea;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px); }
  a { color: inherit; text-decoration: none; }

  /* ---------- Pantalla LCD ---------- */
  #pantalla { width: 100%; flex: 1 1 auto; min-height: 0; max-height: 46vh; display: flex; flex-direction: column;
    background: #120d05; border: 1px solid var(--borde); border-radius: 18px; overflow: hidden;
    box-shadow: inset 0 0 0 6px #0a0805; font-family: ui-monospace, Menlo, monospace; color: var(--ambar); }
  #barra { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px 10px; font-size: 13px; letter-spacing: 1px; border-bottom: 1px solid var(--ambar-osc); }
  #barra .marca { opacity: .75; }
  #lista { flex: 1; overflow-y: auto; padding: 8px 6px; scrollbar-width: none; }
  #lista::-webkit-scrollbar { display: none; }
  #lista a { display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; padding: 10px 14px; border-radius: 8px; }
  #lista a::after { content: '›'; opacity: 0; }
  #lista a.sel { background: var(--ambar); color: #120d05; }
  #lista a.sel::after { opacity: 1; }

  /* ---------- Rueda giratoria ---------- */
  #rueda { position: relative; flex: none; margin: 26px 0 22px; touch-action: none;
    width: min(62vw, 260px, 32vh); aspect-ratio: 1; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, #3a3a3e 0deg 1.2deg, transparent 1.2deg 7.5deg), var(--pieza);
    border: 1px solid var(--borde); }
  #disco { position: absolute; inset: 9%; border-radius: 50%; background: #151517; border: 1px solid var(--borde); }
  #aguja { position: absolute; inset: 0; transition: transform .12s ease-out; pointer-events: none; }
  #aguja::before { content: ''; position: absolute; left: 50%; top: 7%; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: var(--ambar); }
  #centro { position: absolute; inset: 30%; border-radius: 50%; background: var(--pieza); border: 1px solid var(--borde);
    display: flex; align-items: center; justify-content: center; font: 12px ui-monospace, Menlo, monospace;
    color: #8e8e93; letter-spacing: 1px; }
  #rueda.pulsado #centro { background: #232326; color: var(--ambar); }

  /* ---------- Botones ---------- */
  #botones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; flex: none; }
  #botones > * { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px;
    background: var(--pieza); border: 1px solid var(--borde); color: #d0d0d4; font-size: 18px;
    font-family: inherit; padding: 0; }
  #botones > *:active { background: #26262a; color: var(--ambar); }
  #botones .txt { font: 12px ui-monospace, Menlo, monospace; letter-spacing: 1px; }
  #b-play { font-size: 14px; letter-spacing: -1px; }

  /* ---------- Ajustes ---------- */
  #ajustes { display: none; position: fixed; inset: 0; background: #000; overflow-y: auto; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; z-index: 3; }
  #ajustes.ver { display: block; }
  .cabecera { position: sticky; top: calc(-1 * (env(safe-area-inset-top) + 20px)); z-index: 1; background: #000;
    display: flex; align-items: center; justify-content: space-between;
    margin: calc(-1 * (env(safe-area-inset-top) + 20px)) -24px 0;
    padding: calc(env(safe-area-inset-top) + 20px) 24px 12px; border-bottom: 1px solid #222; }
  #ajustes h2 { font-size: 28px; font-weight: 300; margin: 0; }
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; padding: 12px 0; border-bottom: 1px solid #222; }
  #ajustes input { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #333; border-radius: 6px;
    color: #fff; font: 16px -apple-system, system-ui, sans-serif; padding: 10px;
    -webkit-user-select: text; user-select: text; }
  #ajustes button { background: none; border: 1px solid #444; border-radius: 6px; color: #fff;
    font: 15px -apple-system, system-ui, sans-serif; padding: 10px 14px; }
  #ajustes button:active { background: #222; }
  #listo { border-color: var(--ambar) !important; color: var(--ambar) !important; }
  .quitar { grid-row: span 2; border: none !important; color: #8e8e93 !important; font-size: 26px !important; padding: 0 4px !important; }
  .botones-aj { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  #ajustes label { display: block; color: #8e8e93; font-size: 13px; margin: 16px 0 6px; }
  .ayuda { color: #8e8e93; font-size: 13px; line-height: 1.5; margin-top: 16px; }

  #aviso-safari { display: none; position: fixed; z-index: 4; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px);
    background: #1c1c1e; color: #fff; font-size: 14px; line-height: 1.45; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #3a3a3c; }
</style>
</head>
<body>

<div id="aviso-safari">
  Estás en Safari. Para verla a pantalla completa: Compartir → Añadir a pantalla de inicio →
  activa <b>Abrir como app web</b> → Añadir, y ábrela desde ese icono.
</div>

<section id="pantalla">
  <div id="barra"><span class="marca">MÚSICA</span><span id="hora">--:--</span></div>
  <main id="lista"></main>
</section>

<div id="rueda" aria-label="Gira para moverte; toca el centro para abrir">
  <div id="disco"></div>
  <div id="aguja"></div>
  <a id="centro" href="#">OK</a>
</div>

<nav id="botones">
  <button id="b-ajustes" class="txt" aria-label="Ajustes">MENÚ</button>
  <button id="b-ant" aria-label="Anterior">⏮</button>
  <a id="b-play" href="https://open.spotify.com/" aria-label="Ahorro; doble toque: Spotify">▶︎❙❙</a>
  <button id="b-sig" aria-label="Siguiente">⏭</button>
</nav>

<section id="ajustes">
  <div class="cabecera">
    <h2>Ajustes</h2>
    <button id="listo">Listo</button>
  </div>
  <p class="ayuda">Pega tal cual un enlace de Spotify, YouTube o Podimo (Compartir → Copiar enlace):
    se abrirá directamente en su app.</p>
  <div id="filas"></div>
  <div class="botones-aj">
    <button id="anadir">Añadir botón</button>
    <button id="restaurar">Restaurar</button>
  </div>
  <label for="atajo-modo">Atajo de ahorro</label>
  <input id="atajo-modo" autocapitalize="off" autocorrect="off">
  <label for="atajo-sig">Atajo canción siguiente</label>
  <input id="atajo-sig" autocapitalize="off" autocorrect="off">
  <label for="atajo-ant">Atajo canción anterior</label>
  <input id="atajo-ant" autocapitalize="off" autocorrect="off">
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Configuración guardada en el iPhone ----------
  // Enlaces web normales: iOS los pasa a la app sin preguntar "¿Abrir en…?".
  var DEF = {
    botones: [
      { n: 'Spotify', u: 'https://open.spotify.com/' },
      { n: 'YouTube', u: 'https://www.youtube.com/' },
      { n: 'Podimo',  u: 'https://open.podimo.com/' }
    ],
    modo: 'Modo iPod', sig: 'Siguiente', ant: 'Anterior', v: 2
  };
  function copia(o) { return JSON.parse(JSON.stringify(o)); }
  function cargar() {
    try {
      var c = JSON.parse(localStorage.getItem('ipod'));
      if (c && c.botones) {
        var viejos = { 'spotify://': DEF.botones[0].u, 'youtube://': DEF.botones[1].u, 'podimo://': DEF.botones[2].u };
        c.botones.forEach(function (b) { if (viejos[b.u]) b.u = viejos[b.u]; delete b.w; });
        if (!c.v) {
          if (!c.botones.some(function (b) { return /podimo/i.test(b.u); })) c.botones.push(copia(DEF.botones[2]));
          c.v = 2;
        }
        if (!c.botones.length) c.botones = copia(DEF.botones);
        return c;
      }
    } catch (e) {}
    return copia(DEF);
  }
  function guardar() { try { localStorage.setItem('ipod', JSON.stringify(cfg)); } catch (e) {} }
  var cfg = cargar();
  try { localStorage.removeItem('ipod-fondo'); } catch (e) {}   // ya no se usa: libera espacio

  function urlAtajo(nombre) { return 'shortcuts://run-shortcut?name=' + encodeURIComponent(nombre); }

  // ---------- Lista ----------
  var sel = 0;
  function pintar() {
    var l = $('lista');
    l.textContent = '';
    if (sel >= cfg.botones.length) sel = 0;
    cfg.botones.forEach(function (b, i) {
      var a = document.createElement('a');
      a.href = b.u;
      a.textContent = b.n;
      if (i === sel) a.className = 'sel';
      l.appendChild(a);
    });
    var sp = cfg.botones.filter(function (b) { return /spotify/i.test(b.u); })[0];
    $('b-play').href = sp ? sp.u : 'https://open.spotify.com/';
    actualizar();
  }
  function actualizar() {
    var b = cfg.botones[sel];
    $('centro').href = b ? b.u : '#';
    $('aguja').style.transform = 'rotate(' + (sel * 30) + 'deg)';
  }
  function mover(paso) {
    var n = cfg.botones.length;
    if (!n) return;
    var nuevo = Math.min(n - 1, Math.max(0, sel + paso));
    if (nuevo === sel) return;
    var as = $('lista').children;
    as[sel].className = '';
    sel = nuevo;
    as[sel].className = 'sel';
    as[sel].scrollIntoView({ block: 'nearest' });
    actualizar();
  }

  // ---------- Rueda: girar mueve la selección; tocar el centro abre ----------
  var rueda = $('rueda'), PASO = 24, g = null;
  function geo(e) {
    var r = rueda.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    return { ang: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.sqrt(dx * dx + dy * dy), radio: r.width / 2 };
  }
  rueda.addEventListener('pointerdown', function (e) {
    var p = geo(e);
    g = { ang: p.ang, acum: 0, total: 0 };
    rueda.classList.add('pulsado');
    // No se captura el dedo si empieza en el centro: así el toque llega al enlace
    // y iOS abre la app sin preguntar.
    if (p.dist > p.radio * 0.4) rueda.setPointerCapture(e.pointerId);
  });
  rueda.addEventListener('pointermove', function (e) {
    if (!g) return;
    var p = geo(e);
    if (p.dist < p.radio * 0.2) return;
    var d = p.ang - g.ang;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    g.ang = p.ang; g.acum += d; g.total += Math.abs(d);
    while (g.acum >= PASO)  { mover(1);  g.acum -= PASO; }
    while (g.acum <= -PASO) { mover(-1); g.acum += PASO; }
  });
  function soltar() { rueda.classList.remove('pulsado'); girado = g && g.total > 10; g = null; }
  var girado = false;
  rueda.addEventListener('pointerup', soltar);
  rueda.addEventListener('pointercancel', soltar);
  $('centro').addEventListener('click', function (e) {
    if (girado || $('centro').getAttribute('href') === '#') e.preventDefault();
    girado = false;
  });

  // ---------- Botones: un toque y doble toque ----------
  //            un toque                doble toque
  // MENÚ       ajustes                 —
  // ⏮ / ⏭      anterior / siguiente    canción anterior / siguiente (atajos)
  // ▶︎❙❙        ahorro (atajo)          abrir Spotify
  var DOBLE_MS = 350;
  function dobleToque(el, simple, doble) {
    var t = null;
    el.addEventListener('click', function (e) {
      if (t) { clearTimeout(t); t = null; doble(e); return; }
      if (el.tagName === 'A') e.preventDefault();
      t = setTimeout(function () { t = null; simple(); }, DOBLE_MS);
    });
  }
  $('b-ajustes').onclick = abrirAjustes;
  dobleToque($('b-ant'), function () { mover(-1); }, function () { location.href = urlAtajo(cfg.ant || DEF.ant); });
  dobleToque($('b-sig'), function () { mover(1); },  function () { location.href = urlAtajo(cfg.sig || DEF.sig); });
  // En el segundo toque se deja pasar el enlace: es un toque real y Spotify se abre sin aviso.
  dobleToque($('b-play'), function () { location.href = urlAtajo(cfg.modo || DEF.modo); }, function () {});

  // ---------- Reloj: una vez por minuto, parado con la pantalla apagada ----------
  var t;
  function reloj() {
    var d = new Date();
    $('hora').textContent = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    clearTimeout(t);
    t = setTimeout(reloj, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 50);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); else reloj(); });

  // ---------- Ajustes ----------
  function fila(b) {
    var d = document.createElement('div');
    d.className = 'fila';
    var n = document.createElement('input');
    n.className = 'n'; n.placeholder = 'Nombre'; n.value = b.n || '';
    var u = document.createElement('input');
    u.className = 'u'; u.type = 'url'; u.placeholder = 'https://open.spotify.com/playlist/…'; u.value = b.u || '';
    u.setAttribute('autocapitalize', 'off'); u.setAttribute('autocorrect', 'off');
    var x = document.createElement('button');
    x.className = 'quitar'; x.textContent = '×'; x.setAttribute('aria-label', 'Quitar');
    x.onclick = function () { d.remove(); };
    d.appendChild(n); d.appendChild(x); d.appendChild(u);
    return d;
  }
  function rellenar(c) {
    var f = $('filas');
    f.textContent = '';
    c.botones.forEach(function (b) { f.appendChild(fila(b)); });
    $('atajo-modo').value = c.modo || DEF.modo;
    $('atajo-sig').value = c.sig || DEF.sig;
    $('atajo-ant').value = c.ant || DEF.ant;
  }
  function abrirAjustes() { rellenar(cfg); $('ajustes').scrollTop = 0; $('ajustes').classList.add('ver'); }
  $('anadir').onclick = function () { $('filas').appendChild(fila({})); };
  $('restaurar').onclick = function () { rellenar(copia(DEF)); };
  $('listo').onclick = function () {
    cfg.botones = Array.prototype.map.call($('filas').children, function (d) {
      return { n: d.querySelector('.n').value.trim(), u: d.querySelector('.u').value.trim() };
    }).filter(function (b) { return b.n && b.u; });
    if (!cfg.botones.length) cfg.botones = copia(DEF.botones);   // nunca dejar la lista vacía
    cfg.modo = $('atajo-modo').value.trim() || DEF.modo;
    cfg.sig = $('atajo-sig').value.trim() || DEF.sig;
    cfg.ant = $('atajo-ant').value.trim() || DEF.ant;
    guardar();
    sel = 0;
    pintar();
    $('ajustes').classList.remove('ver');
  };

  if (navigator.standalone === false) $('aviso-safari').style.display = 'block';
  pintar();
  reloj();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
