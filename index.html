<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iPod">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>iPod</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden; }
  body { display: flex; flex-direction: column; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 20px) 28px calc(env(safe-area-inset-bottom) + 24px); }
  a { color: #fff; text-decoration: none; display: block; }

  /* Pantalla superior */
  #reloj { display: flex; align-items: baseline; justify-content: space-between; }
  #hora  { font-size: 44px; font-weight: 200; letter-spacing: -1px; line-height: 1; }
  #fecha { font-size: 13px; color: #8e8e93; }
  #lista { margin-top: 24px; }

  #lista { flex: 1; overflow-y: auto; scrollbar-width: none; }
  #lista::-webkit-scrollbar { display: none; }
  #lista a { font-size: 32px; font-weight: 300; letter-spacing: -0.3px;
    padding: 9px 14px; margin: 0 -14px; border-radius: 8px; }
  #lista a.sel { background: #1f1f1f; }

  /* Rueda */
  #rueda { position: relative; flex: none; align-self: center; margin-top: 18px;
    width: min(74vw, 290px); aspect-ratio: 1; border-radius: 50%;
    border: 1px solid #2c2c2e; touch-action: none; }
  #centro { position: absolute; inset: 31%; border-radius: 50%; border: 1px solid #2c2c2e; }
  #rueda.pulsado-centro #centro { background: #141414; }
  .et { position: absolute; font: 11px ui-monospace, Menlo, monospace; color: #8e8e93; pointer-events: none; }
  .arriba { top: 11%; left: 50%; transform: translateX(-50%); }
  .abajo  { bottom: 11%; left: 50%; transform: translateX(-50%); }

  /* Ajustes */
  #ajustes { display: none; position: fixed; inset: 0; background: #000; overflow-y: auto; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #ajustes.ver { display: block; }
  .cabecera { position: sticky; top: calc(-1 * (env(safe-area-inset-top) + 20px)); z-index: 1; background: #000;
    display: flex; align-items: center; justify-content: space-between;
    margin: calc(-1 * (env(safe-area-inset-top) + 20px)) -24px 0;
    padding: calc(env(safe-area-inset-top) + 20px) 24px 12px; border-bottom: 1px solid #222; }
  #ajustes h2 { font-size: 28px; font-weight: 300; margin: 0; }
  #listo { border-color: #fff; }
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; padding: 12px 0; border-bottom: 1px solid #222; }
  input { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #333; border-radius: 6px;
    color: #fff; font: 16px -apple-system, system-ui, sans-serif; padding: 10px;
    -webkit-user-select: text; user-select: text; }
  button { background: none; border: 1px solid #444; border-radius: 6px; color: #fff;
    font: 15px -apple-system, system-ui, sans-serif; padding: 10px 14px; }
  button:active { background: #222; }
  .quitar { grid-row: span 2; border: none; color: #8e8e93; font-size: 26px; padding: 0 4px; }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  label { display: block; color: #8e8e93; font-size: 13px; margin: 16px 0 6px; }
  .ayuda { color: #8e8e93; font-size: 13px; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>

<header id="reloj">
  <div id="hora">--:--</div>
  <div id="fecha"></div>
</header>
<main id="lista"></main>

<div id="rueda" aria-label="Rueda: gira para moverte, toca el centro para abrir">
  <span class="et arriba">ajustes</span>
  <span class="et abajo">ahorro</span>
  <a id="centro" href="#" aria-label="Abrir"></a>
</div>

<section id="ajustes">
  <div class="cabecera">
    <h2>Ajustes</h2>
    <button id="listo">Listo</button>
  </div>
  <p class="ayuda">Pega tal cual un enlace de Spotify, YouTube o Podimo (Compartir → Copiar enlace):
    se abrirá directamente en su app.</p>
  <div id="filas"></div>
  <div class="botones">
    <button id="anadir">Añadir botón</button>
    <button id="restaurar">Restaurar</button>
  </div>
  <label for="atajo-modo">Atajo de ahorro (modo iPod)</label>
  <input id="atajo-modo" autocapitalize="off" autocorrect="off">
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Configuración guardada en el iPhone ----------
  var DEF = {
    // Enlaces web normales: iOS los pasa a la app sin preguntar "¿Abrir en…?".
    botones: [
      { n: 'Spotify', u: 'https://open.spotify.com/' },
      { n: 'YouTube', u: 'https://www.youtube.com/' },
      { n: 'Podimo',  u: 'https://open.podimo.com/' }
    ],
    modo: 'Modo iPod',
    v: 2
  };
  function copia(o) { return JSON.parse(JSON.stringify(o)); }
  function cargar() {
    try {
      var c = JSON.parse(localStorage.getItem('ipod'));
      if (c && c.botones) {
        // Cambia los enlaces antiguos (spotify://…), que hacían preguntar a iOS, por los web.
        var viejos = { 'spotify://': DEF.botones[0].u, 'youtube://': DEF.botones[1].u, 'podimo://': DEF.botones[2].u };
        c.botones.forEach(function (b) { if (viejos[b.u]) b.u = viejos[b.u]; delete b.w; });
        // Una sola vez: recupera Podimo si se borró sin querer.
        if (!c.v) {
          var tiene = c.botones.some(function (b) { return /podimo/i.test(b.u); });
          if (!tiene) c.botones.push(copia(DEF.botones[2]));
          c.v = 2;
          try { localStorage.setItem('ipod', JSON.stringify(c)); } catch (e) {}
        }
        return c;
      }
    } catch (e) {}
    return copia(DEF);
  }
  function guardar() { try { localStorage.setItem('ipod', JSON.stringify(cfg)); } catch (e) {} }
  var cfg = cargar();

  // ---------- Enlaces ----------
  // Todo se abre con enlaces reales (<a href>) tocados con el dedo: es lo que
  // permite a iOS abrir la app directamente, sin el aviso "¿Abrir en…?".
  function urlAtajo(nombre) {
    return 'shortcuts://run-shortcut?name=' + encodeURIComponent(nombre);
  }

  // ---------- Lista ----------
  var sel = 0;
  function elementos() { return cfg.botones; }
  function pintar() {
    var l = $('lista'), els = elementos();
    l.textContent = '';
    if (sel >= els.length) sel = Math.max(0, els.length - 1);
    els.forEach(function (b, i) {
      var a = document.createElement('a');
      a.href = b.u;
      a.textContent = b.n;
      if (i === sel) a.className = 'sel';
      l.appendChild(a);
    });
    centro();
  }
  function centro() {
    var b = elementos()[sel];
    $('centro').href = b ? b.u : '#';
  }
  function mover(paso) {
    var n = elementos().length;
    if (!n) return;
    var nuevo = Math.min(n - 1, Math.max(0, sel + paso));
    if (nuevo === sel) return;
    var as = $('lista').children;
    as[sel].className = '';
    sel = nuevo;
    as[sel].className = 'sel';
    as[sel].scrollIntoView({ block: 'nearest' });
    centro();
  }
  $('centro').onclick = function (e) {
    if ($('centro').getAttribute('href') === '#') e.preventDefault();
  };

  // ---------- Rueda ----------
  // Girar mueve la selección (un paso cada 24°). Tocar: centro = abrir,
  // arriba = ajustes, abajo = ahorro.
  var rueda = $('rueda');
  var PASO = 24, g = null;

  function geo(e) {
    var r = rueda.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    return { ang: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.sqrt(dx * dx + dy * dy), radio: r.width / 2 };
  }
  rueda.addEventListener('pointerdown', function (e) {
    var p = geo(e);
    g = { ang: p.ang, acum: 0, total: 0, centro: p.dist < p.radio * 0.38, inicio: p };
    // En el centro no se captura el dedo, para que el toque llegue al enlace tal cual.
    if (g.centro) rueda.classList.add('pulsado-centro');
    else rueda.setPointerCapture(e.pointerId);
  });
  rueda.addEventListener('pointermove', function (e) {
    if (!g) return;
    var p = geo(e);
    if (p.dist < p.radio * 0.2) return;          // demasiado cerca del centro para medir el giro
    var d = p.ang - g.ang;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    g.ang = p.ang; g.acum += d; g.total += Math.abs(d);
    while (g.acum >= PASO)  { mover(1);  g.acum -= PASO; }
    while (g.acum <= -PASO) { mover(-1); g.acum += PASO; }
  });
  function soltar() {
    rueda.classList.remove('pulsado-centro');
    if (!g) return;
    var giro = g.total > 10, p = g.inicio;
    var centro = g.centro;
    g = null;
    if (giro || centro) return;                  // el toque en el centro lo abre el propio enlace
    var a = p.ang;                               // 0° = derecha, 90° = abajo
    if (a > -135 && a < -45) abrirAjustes();
    else if (a > 45 && a < 135) location.href = urlAtajo(cfg.modo);
  }
  rueda.addEventListener('pointerup', soltar);
  rueda.addEventListener('pointercancel', function () { rueda.classList.remove('pulsado-centro'); g = null; });

  // ---------- Reloj: una vez por minuto, parado con la pantalla apagada ----------
  var t;
  function reloj() {
    var d = new Date();
    $('hora').textContent = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    $('fecha').textContent = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
    clearTimeout(t);
    t = setTimeout(reloj, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 50);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearTimeout(t); else reloj();
  });

  // ---------- Ajustes ----------
  function fila(b) {
    var d = document.createElement('div');
    d.className = 'fila';
    d.dataset.w = b.w || '';
    var n = document.createElement('input');
    n.className = 'n'; n.placeholder = 'Nombre'; n.value = b.n || '';
    var u = document.createElement('input');
    u.className = 'u'; u.type = 'url'; u.placeholder = 'https://open.spotify.com/playlist/…'; u.value = b.u || '';
    u.setAttribute('autocapitalize', 'off'); u.setAttribute('autocorrect', 'off');
    var x = document.createElement('button');
    x.className = 'quitar'; x.textContent = '×'; x.setAttribute('aria-label', 'Quitar');
    x.onclick = function () { d.remove(); };
    d.appendChild(n); d.appendChild(x); d.appendChild(u);
    return d;
  }
  function rellenar(c) {
    var f = $('filas');
    f.textContent = '';
    c.botones.forEach(function (b) { f.appendChild(fila(b)); });
    $('atajo-modo').value = c.modo;
  }
  function abrirAjustes() { rellenar(cfg); $('ajustes').scrollTop = 0; $('ajustes').classList.add('ver'); }

  $('anadir').onclick = function () { $('filas').appendChild(fila({})); };
  $('restaurar').onclick = function () { rellenar(copia(DEF)); };
  $('listo').onclick = function () {
    cfg.botones = Array.prototype.map.call($('filas').children, function (d) {
      var b = { n: d.querySelector('.n').value.trim(), u: d.querySelector('.u').value.trim() };
      if (d.dataset.w) b.w = d.dataset.w;
      return b;
    }).filter(function (b) { return b.n && b.u; });
    cfg.modo = $('atajo-modo').value.trim() || DEF.modo;
    guardar();
    sel = 0;
    pintar();
    $('ajustes').classList.remove('ver');
  };

  pintar();
  reloj();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
